###############
#### BINDS ###
#############

# Unset default prefix
unbind C-b
# Set Prefix to Ctrl+a
set-option -g prefix C-a
bind-key C-a send-prefix
set -s escape-time 10
set -g allow-passthrough on

# Resize the current pane using Alt + direction
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5

# Navigation
bind -n M-h previous-window
bind -n M-l next-window

# Pane navigation
bind -n M-n select-pane -L
bind -n M-. select-pane -R
bind -n M-m select-pane -U 
bind -n M-, select-pane -D

##################
### SETTINGS ####
#################

setw -q -g utf8 on
setw -g mouse on
set -g renumber-windows on
set-option -g automatic-rename on 
set-option -g allow-rename off 
set -g set-titles on
set -g base-index 1
setw -g pane-base-index 1 

# Splits
bind-key v split-window -h
bind-key h split-window -v

# Easy config reload
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Terminal Overrides
set-option -sa terminal-features ',kitty:RGB'
set-option -sa terminal-overrides ',xterm-256color:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

##################################
###   DESIGN CHANGES (EMACS)   ###
##################################

# --- Emacs / Doom One Variables ---
set -g @emacs-bg        "default"   # Changed to default for transparency
set -g @emacs-fg        "#bbc2cf"
set -g @emacs-blue      "#51afef"
set -g @emacs-green     "#98be65"
set -g @emacs-red       "#ff6c6b"
set -g @emacs-yellow    "#ecbe7b"
set -g @emacs-purple    "#c678dd"
set -g @emacs-inactive  "#5b6268"
set -g @emacs-modeline  "default"   # Changed to default for transparency

# --- Clock Mode ---
setw -g -F clock-mode-colour "#{@emacs-blue}"

# --- Copy Mode & Prompts ---
setw -g -F mode-style "fg=#282c34,bg=#{@emacs-purple},bold"

# --- Panes ---
# Ensuring borders don't bring in a background color
set -g -F pane-border-style "fg=#3f444a,bg=default"
set -g -F pane-active-border-style "fg=#{@emacs-blue},bg=default"

# --- Status Bar Layout ---
set -g status-position bottom
set -g status-justify centre
set -g status-left-length 60
set -g status-right-length 60

# Main status style set to default for transparency
set -g -F status-style "bg=default,fg=#{@emacs-fg},none"

# Left Side
set -g -F status-left " #[fg=#{@emacs-purple}]λ #[fg=#{@emacs-blue},bold]##S #[fg=#{@emacs-inactive}]  "

# Right Side
set -g -F status-right "#[fg=#{@emacs-green}]%a %d %b #[fg=#{@emacs-fg}]| #[fg=#{@emacs-blue}]%H:%M "

# --- Current Window (Floating Tab Look) ---
# We keep the blue bg for the active index so it stands out against the transparency
set -g -F window-status-current-format "#[fg=#282c34,bg=#{@emacs-blue},bold] ##I #[fg=#{@emacs-fg},bg=default,bold] ##W "

# --- Inactive Windows ---
set -g -F window-status-format "#[fg=#{@emacs-inactive},bg=default] ##I ##W"

# --- Bell/Alert Window ---
setw -g -F window-status-bell-style "fg=#282c34,bg=#{@emacs-red},bold"

# --- Message Prompts ---
set -g -F message-style "fg=#282c34,bg=#{@emacs-yellow},bold"

#########################
###### Plugins #########
########################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'noscript/tmux-mighty-scroll'

set -g @resurrect-strategy-nvim 'session'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# Clipboard fix
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
