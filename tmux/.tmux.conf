###############
#### BINDS ###
#############

# Unset default prefix
unbind C-b
# Set Prefix to Ctrl+a
set-option -g prefix C-a
bind-key C-a send-prefix
set -s escape-time 10
set -g allow-passthrough on

# Resize the current pane using Alt + direction
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5

# Navigation
bind -n M-h previous-window
bind -n M-l next-window

# Pane navigation
bind -n M-n select-pane -L
bind -n M-. select-pane -R
bind -n M-m select-pane -U 
bind -n M-, select-pane -D

##################
### SETTINGS ####
#################

setw -q -g utf8 on
setw -g mouse on
set -g renumber-windows on
set-option -g automatic-rename on 
set-option -g allow-rename off 
set -g set-titles on
set -g base-index 1
setw -g pane-base-index 1 

# Splits
bind-key v split-window -h
bind-key h split-window -v

# Easy config reload
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Terminal Overrides
set-option -sa terminal-features ',kitty:RGB'
set-option -sa terminal-overrides ',xterm-256color:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

#########################################
###   DESIGN CHANGES (MODUS-VIVENDI)  ###
#########################################

# --- Modus Variables ---
set -g @modus-bg        "default"   # Transparent background
set -g @modus-fg        "#ffffff"   # fg-main
set -g @modus-black     "#000000"   # bg-main (for high contrast text)
set -g @modus-gray      "#a8a8a8"   # fg-dim
set -g @modus-blue      "#00bcff"   # blue-bright (Primary Accent)
set -g @modus-magenta   "#feacd0"   # magenta-bright (Secondary Accent)
set -g @modus-green     "#44bc44"   # green-bright
set -g @modus-orange    "#f4a344"   # yellow-bright / orange
set -g @modus-red       "#ff5f5f"   # red-bright

# --- Clock Mode ---
setw -g -F clock-mode-colour "#{@modus-blue}"

# --- Copy Mode & Prompts ---
setw -g -F mode-style "fg=#{@modus-black},bg=#{@modus-magenta},bold"

# --- Panes ---
set -g -F pane-border-style "fg=#{@modus-gray},bg=default"
set -g -F pane-active-border-style "fg=#{@modus-blue},bg=default"

# --- Status Bar Layout ---
set -g status-position bottom
set -g status-justify centre
set -g status-left-length 60
set -g status-right-length 60

# Main status style set to default for transparency
set -g -F status-style "bg=default,fg=#{@modus-fg},none"

# Left Side
set -g -F status-left " #[fg=#{@modus-magenta}]λ #[fg=#{@modus-blue},bold]##S #[fg=#{@modus-gray}]  "

# Right Side
set -g -F status-right "#[fg=#{@modus-green}]%a %d %b #[fg=#{@modus-gray}]| #[fg=#{@modus-blue}]%H:%M "

# --- Current Window (Floating Tab Look) ---
set -g -F window-status-current-format "#[fg=#{@modus-black},bg=#{@modus-blue},bold] ##I #[fg=#{@modus-fg},bg=default,bold] ##W "

# --- Inactive Windows ---
set -g -F window-status-format "#[fg=#{@modus-gray},bg=default] ##I ##W"

# --- Bell/Alert Window ---
setw -g -F window-status-bell-style "fg=#{@modus-black},bg=#{@modus-red},bold"

# --- Message Prompts ---
set -g -F message-style "fg=#{@modus-black},bg=#{@modus-orange},bold"

#########################
###### Plugins #########
########################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'noscript/tmux-mighty-scroll'

set -g @resurrect-strategy-nvim 'session'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# Clipboard fix
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

